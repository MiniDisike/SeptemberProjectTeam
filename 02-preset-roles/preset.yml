name: 九月项目团
description: >-
  在标准编码 Agent 之上装八个角色（8 席）：监督员/审查/记录/支线守门员/提问闸门/资料员/方向员 共 7 席有票，
  另有 AI测试用户 1 席无票（站用户位置做预演，意见是预测不是授权）。
  带三个固定人格的派单口（subagent_liaison 资料员 / subagent_direction 方向员 / subagent_coder 实现工程师）。
  角色协议已加固（team-guard 插件）：协议段排在 system prompt 末尾、每一步有一行实时状态、
  且本会话第一次写文件前若还没有任何角色参与过会被拒一次（一会话一次，子代理与重试放行）。
  要求：长任务把用户原话逐字锁进 .warden、每轮 record、宣布完成前 check；
  写代码并行派 subagent_coder；脑子默认 1 个，只有冲突/查得不细/要探索更多做法时才派第 2 个；
  角色说话必须按「名字 · 职称：原话」直接显示（warden role say），不许主代理转述（warden role scan 自查）。
